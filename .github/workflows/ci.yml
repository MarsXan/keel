name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Install dev tools (typescript, node types)
        run: npm install --no-audit --no-fund
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: fixtures/nestjs-sample/package.json
      - name: Install the fixture monorepo (keel-nestjs canaries run against it)
        run: pnpm install --frozen-lockfile
        working-directory: fixtures/nestjs-sample
      - name: Type-check the CLI (JSDoc, strict)
        run: npm run typecheck
      - name: Unit and guard tests
        run: npm test
      - name: Validate the marketplace and plugin manifests
        run: |
          npx --yes @anthropic-ai/claude-code plugin validate . --strict
          npx --yes @anthropic-ai/claude-code plugin validate plugins/keel --strict
          npx --yes @anthropic-ai/claude-code plugin validate plugins/keel-nestjs --strict
