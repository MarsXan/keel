name: keel-audit

# The weekly drift report. Copy to .github/workflows/ (a guardrail change: /keel:amend).
# Set the repository variable KEEL_REPOSITORY (owner/repo of your Keel checkout) and, when
# that repository is private, a KEEL_TOKEN secret that can read it.
on:
  schedule:
    - cron: '0 6 * * 1' # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # hotspots and fix share read the history
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Fetch the Keel CLI (outside the workspace)
        env:
          KEEL_REPOSITORY: ${{ vars.KEEL_REPOSITORY }}
          KEEL_REF: ${{ vars.KEEL_REF || 'main' }}
          KEEL_TOKEN: ${{ secrets.KEEL_TOKEN || github.token }}
        run: git clone --quiet --depth 1 --branch "$KEEL_REF" "https://x-access-token:${KEEL_TOKEN}@github.com/${KEEL_REPOSITORY}.git" "$RUNNER_TEMP/keel-cli"
      - name: keel audit
        run: |
          node "$RUNNER_TEMP/keel-cli/plugins/keel/bin/keel" audit --metrics > keel-audit.md
          cat keel-audit.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: keel-audit
          path: keel-audit.md
