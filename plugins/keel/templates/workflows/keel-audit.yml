name: keel-audit

# The weekly drift report. Copy to .github/workflows/ (a guardrail change: /keel:amend).
# Set the repository variable KEEL_REPOSITORY (owner/repo of your Keel checkout) and, when
# that repository is private, a KEEL_TOKEN secret that can read it.
on:
  schedule:
    - cron: '0 6 * * 1' # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # hotspots and fix share read the history
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check out the Keel CLI
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.KEEL_REPOSITORY }}
          ref: ${{ vars.KEEL_REF || 'main' }}
          token: ${{ secrets.KEEL_TOKEN || github.token }}
          path: .keel-cli
      - name: keel audit
        run: |
          node .keel-cli/plugins/keel/bin/keel audit --metrics > keel-audit.md
          cat keel-audit.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: keel-audit
          path: keel-audit.md
